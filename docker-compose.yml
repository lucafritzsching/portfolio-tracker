services:
  postgres:
    image: postgres:16-alpine
    container_name: portfaio-postgres
    environment:
      POSTGRES_DB: portfaio
      POSTGRES_USER: portfaio
      POSTGRES_PASSWORD: portfaio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfaio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NOTE: Ollama runs NATIVELY on the host (not in Docker) so it can use the
  # Mac's Metal GPU (or an NVIDIA GPU on Linux/Windows). A container on macOS
  # would be CPU-only and far too slow for a 14B model. The backend reaches the
  # host's Ollama via host.docker.internal. Install Ollama locally and run:
  #   ollama pull qwen3:14b

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfaio-backend
    ports:
      - "8000:8000"
    # Secrets (FINNHUB_API_KEY, NEWS_API_KEY) come from backend/.env — single source of truth.
    env_file:
      - ./backend/.env
    # Override localhost values from backend/.env with container-reachable hosts:
    # postgres via the compose network, Ollama via the host (native, GPU-accelerated).
    environment:
      DATABASE_URL: postgresql+asyncpg://portfaio:portfaio@postgres:5432/portfaio
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # makes the host reachable on Linux too
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
