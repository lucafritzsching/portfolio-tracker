services:
  postgres:
    image: postgres:16-alpine
    container_name: portfaio-postgres
    environment:
      POSTGRES_DB: portfaio
      POSTGRES_USER: portfaio
      POSTGRES_PASSWORD: portfaio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfaio"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: portfaio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (optional, remove if no NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfaio-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://portfaio:portfaio@postgres:5432/portfaio
      OLLAMA_BASE_URL: http://ollama:11434
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  ollama_data:
